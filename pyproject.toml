[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-smartroute"
version = "3.0.0"
description = "Route only what you trust. Gate agents and tools with trust scores and guardrails."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "SmartTasks Lab" }]
keywords = ["smart", "ai", "iaiso", "sf-smartroute", "devtools"]
dependencies = []
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://smarttasks.cloud"
Source = "https://github.com/SmartTasksOrg/sf-smartroute"
Issues = "https://github.com/SmartTasksOrg/sf-smartroute/issues"
Security = "https://github.com/SmartTasksOrg/sf-smartroute/security/policy"
Changelog = "https://github.com/SmartTasksOrg/sf-smartroute/blob/master/CHANGELOG.md"
Standard = "https://iaiso.org"

[project.scripts]
sf-smartroute = "sf_smartroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
