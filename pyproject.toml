[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartroute"
version = "3.0.0"
description = "Route only what you trust. Gate agents and tools with trust scores and guardrails."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SmartTasks Lab" }]
keywords = ["smart", "ai", "iaiso", "smartroute", "devtools"]
dependencies = []

[project.urls]
Homepage = "https://smarttasks.cloud"
Standard = "https://iaiso.org"
Repository = "https://github.com/SmartTasksOrg/smartroute"

[project.scripts]
smartroute = "smartroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
